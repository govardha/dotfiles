# Common approved commands for all profiles
# Add universal commands here (git, gh, bkt) that should be auto-approved across all teams
approved_commands:
  # Git status and inspection
  - matcher: Bash
    filter: "git status"
    description: "Check git working tree status"
  - matcher: Bash
    filter: "git diff"
    description: "View file changes"
  - matcher: Bash
    filter: "git log"
    description: "View git commit history"
  - matcher: Bash
    filter: "git show"
    description: "Show commit details"
  - matcher: Bash
    filter: "git branch"
    description: "List or create branches"
  - matcher: Bash
    filter: "git remote"
    description: "Manage remote repositories"
  - matcher: Bash
    filter: "git fetch"
    description: "Fetch from remote"
  - matcher: Bash
    filter: "git pull"
    description: "Fetch and merge remote changes"

  # Git modifications
  - matcher: Bash
    filter: "git add"
    description: "Stage files for commit"
  - matcher: Bash
    filter: "git commit"
    description: "Allow git commits"
  - matcher: Bash
    filter: "git checkout"
    description: "Switch branches or restore files"
  - matcher: Bash
    filter: "git switch"
    description: "Switch to a different branch"
  - matcher: Bash
    filter: "git stash"
    description: "Stash changes temporarily"
  - matcher: Bash
    filter: "git blame"
    description: "Show file history and authorship"
  - matcher: Bash
    filter: "git grep"
    description: "Search git repository"
  - matcher: Bash
    filter: "git ls-files"
    description: "List tracked files"
  - matcher: Bash
    filter: "git rev-parse"
    description: "Get git object names"
  - matcher: Bash
    filter: "git push"
    description: "Push commits to remote"

